<script>
  /* El service worker solo funciona sobre http(s). Si se abre el archivo
     directamente (file://) o dentro de un visor con restricciones, la app
     sigue funcionando igual: los datos están en IndexedDB, no en la red. */
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      /* Acá NO hay ningún location.reload(). Recargar al cambiar de service
         worker parece buena idea, pero con skipWaiting() + clients.claim() es
         la receta clásica del bucle de recargas: cualquier cosa que haga
         reinstalar el worker deja la app recargándose sola sin parar. Y no
         hace falta: con ?v= en los <script>, must-revalidate y el worker
         pidiendo el código a la red primero, la próxima vez que se abra la app
         ya se baja la versión nueva. */

      /* updateViaCache:'none' es la clave: sin esto el navegador puede leer el
         propio sw.js desde su caché HTTP y no enterarse nunca de que cambió. */
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .then(function (reg) {
          var lastCheck = 0;
          function check() {
            /* como mucho una consulta por minuto: visibilitychange se dispara
               muchas veces y no tiene sentido pedir sw.js en cada una */
            var now = Date.now();
            if (now - lastCheck < 60000) return;
            lastCheck = now;
            reg.update();
          }
          check();
          document.addEventListener('visibilitychange', function () {
            if (!document.hidden) check();
          });
        })
        ['catch'](function () { /* sin offline, sin drama */ });
    });
  }
</script>
